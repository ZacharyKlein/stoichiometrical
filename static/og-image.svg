<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Stoichiometrical social preview</title>
  <desc id="desc">A preview card for Stoichiometrical, a stoichiometry learning app with visual conversion pathways.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf8"/>
      <stop offset="0.48" stop-color="#edf4f5"/>
      <stop offset="1" stop-color="#fbf8f1"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f8f67"/>
      <stop offset="0.52" stop-color="#217f8f"/>
      <stop offset="1" stop-color="#d17a22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1a2732" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="60" y="56" width="1080" height="518" rx="26" fill="#ffffff" fill-opacity="0.9" stroke="#d9e2e4" filter="url(#shadow)"/>
  <rect x="60" y="56" width="1080" height="10" rx="5" fill="url(#bar)"/>

  <g transform="translate(104 112)">
    <path d="M28 31 L56 16" stroke="#a9b8bd" stroke-width="6" stroke-linecap="round"/>
    <path d="M28 40 L56 55" stroke="#a9b8bd" stroke-width="6" stroke-linecap="round"/>
    <circle cx="23" cy="36" r="14" fill="#2f8f67"/>
    <circle cx="61" cy="13" r="13" fill="#d17a22"/>
    <circle cx="61" cy="58" r="13" fill="#3170b7"/>
    <circle cx="23" cy="36" r="21" fill="none" stroke="#2f8f67" stroke-opacity="0.16" stroke-width="7"/>
    <circle cx="61" cy="13" r="20" fill="none" stroke="#d17a22" stroke-opacity="0.16" stroke-width="7"/>
    <circle cx="61" cy="58" r="20" fill="none" stroke="#3170b7" stroke-opacity="0.16" stroke-width="7"/>
    <text x="96" y="43" fill="#2f8f67" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="0">STOICHIOMETRICAL</text>
  </g>

  <text x="104" y="252" fill="#172026" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="900" letter-spacing="0">See every step</text>
  <text x="104" y="334" fill="#172026" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="900" letter-spacing="0">in the conversion.</text>
  <text x="108" y="402" fill="#66727b" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="760">Guided inputs, visual pathways, and step-by-step math</text>
  <text x="108" y="442" fill="#66727b" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="760">for stoichiometry practice.</text>

  <g transform="translate(694 144)">
    <rect x="0" y="0" width="356" height="274" rx="22" fill="#f8fbfa" stroke="#d9e2e4"/>
    <text x="32" y="54" fill="#172026" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="860">Conversion map</text>
    <path d="M86 145 C128 104 178 104 218 145" fill="none" stroke="#2f8f67" stroke-width="9" stroke-linecap="round"/>
    <path d="M218 145 C260 104 308 104 326 145" fill="none" stroke="#c84f4f" stroke-width="9" stroke-linecap="round"/>
    <circle cx="68" cy="158" r="43" fill="#edf7f2" stroke="#b9dbc9" stroke-width="3"/>
    <circle cx="178" cy="158" r="43" fill="#fff6ea" stroke="#efd1af" stroke-width="3"/>
    <circle cx="288" cy="158" r="43" fill="#eef5fb" stroke="#bdd4ed" stroke-width="3"/>
    <text x="68" y="153" text-anchor="middle" fill="#172026" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="850">Mass</text>
    <text x="178" y="153" text-anchor="middle" fill="#172026" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="850">Moles</text>
    <text x="288" y="153" text-anchor="middle" fill="#172026" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="850">Atoms</text>
    <rect x="32" y="226" width="292" height="24" rx="12" fill="url(#bar)" opacity="0.9"/>
  </g>
</svg>
